name: "Checks"
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    name: 🗿 Run All
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run checks
        uses: ./.github/actions/checks
